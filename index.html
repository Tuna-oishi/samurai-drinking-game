function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function layout(){// Approximate screen-centimeter shifts: jug +3cm, character +3cm right / 1cm up (shifted 1cm left).
const scale=Math.min(W/900,H/640);return {scale,pivot:{x:W*.43+(38+114)*scale,y:H*.43},mouth:{x:W*.29+114*scale,y:H*.72-38*scale,rx:Math.max(24,45*scale),ry:Math.max(12,22*scale)}}}
function tip(l){const a=-angle*Math.PI/180;const x=-150*l.scale,y=-15*l.scale;return {x:l.pivot.x+x*Math.cos(a)-y*Math.sin(a),y:l.pivot.y+x*Math.sin(a)+y*Math.cos(a)}}
function flowHits(l){if(angle<CFG.minAngle||angle>CFG.maxGood)return false;const p=tip(l);const targetY=l.mouth.y;const fall=targetY-p.y;if(fall<=0)return false;const landingX=p.x-0.10*fall;return Math.abs(landingX-l.mouth.x)<l.mouth.rx*.9}
function reset(){playing=true;pressed=false;angle=0;drunk=0;lock=0;remaining=CFG.duration;successful=0;particles=[];spawnAcc=0;hitFlash=0;holdTime=0;last=performance.now();pourBtn.disabled=false;pourBtn.classList.remove('pressed');startOverlay.classList.add('hidden');endOverlay.classList.add('hidden');updateUI()}
function finish(){playing=false;pressed=false;pourBtn.disabled=true;pourBtn.classList.remove('pressed');const secs=Math.round((successful+Number.EPSILON)*10)/10;document.querySelector('#finalScore').textContent=Math.round(secs*1000).toLocaleString('zh-TW')+' 毫升';endOverlay.classList.remove('hidden');statusEl.textContent=''}
function updateUI(){timeEl.textContent=remaining.toFixed(1)+' 秒';const secs=Math.round((successful+Number.EPSILON)*10)/10;scoreEl.textContent=Math.round(secs*1000).toLocaleString('zh-TW')+' mL';drunkEl.style.height=(lock>0?drunk:(drunk>=98?100:drunk))+'%';statusEl.classList.toggle('drunk-alert',lock>0);statusEl.textContent=lock>0?'醉倒啦！ '+lock.toFixed(1)+' 秒':(pressed&&angle>CFG.maxGood?'倒過頭啦！':(pressed&&angle>=CFG.minAngle?'接住了！':''))}
function spawn(l,hit){const p=tip(l);const count=3;for(let i=0;i<count;i++){const size=(2+Math.random()*5)*l.scale;particles.push({x:p.x+(Math.random()-.5)*9*l.scale,y:p.y+(Math.random()-.5)*9*l.scale,vx:(hit?-22:-48)+(Math.random()-.5)*28,vy:20+Math.random()*45,r:Math.max(2,size),life:1.7,hit})}}
function update(dt){if(!playing)return;remaining=Math.max(0,remaining-dt);if(remaining<=0){finish();updateUI();return}if(lock>0){lock=Math.max(0,lock-dt);pressed=false;holdTime=0;angle=Math.max(0,angle-CFG.resetSpeed*dt);drunk=lock===0?0:100*(lock/CFG.lockSeconds);pourBtn.disabled=true}else{pourBtn.disabled=false;if(pressed){holdTime+=dt;const speed=Math.min(65,30+5*Math.floor(holdTime/0.5));angle=Math.min(CFG.maxAngle,angle+speed*dt)}else{holdTime=0;angle=Math.max(0,angle-CFG.resetSpeed*dt)}}
const l=layout(),hit=lock===0&&pressed&&flowHits(l);if(hit){successful+=dt;drunk=Math.min(100,drunk+CFG.drunkRate*dt);hitFlash=.16}else if(lock===0){drunk=Math.max(0,drunk-CFG.drunkDecayRate*dt)}if(drunk>=100&&lock===0){lock=CFG.lockSeconds;pressed=false;pourBtn.classList.remove('pressed');pourBtn.disabled=true}
if(pressed&&angle>=CFG.minAngle&&lock===0){spawnAcc+=dt*20;while(spawnAcc>=1){spawn(l,hit);spawnAcc-=1}}else spawnAcc=0;
for(const p of particles){p.vy+=CFG.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.hit&&Math.abs(p.x-l.mouth.x)<l.mouth.rx&&p.y>=l.mouth.y-l.mouth.ry&&p.y<=l.mouth.y+l.mouth.ry)p.life=0}particles=particles.filter(p=>p.life>0&&p.y<H+30);hitFlash=Math.max(0,hitFlash-dt);updateUI()}
function draw(){ctx.clearRect(0,0,W,H);const l=layout(),s=l.scale,p=l.pivot,m=l.mouth;
// Backdrop motifs
ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#e9c487';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(W*.5,H*.56,110*s+i*28*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke()}ctx.restore();
// Character artwork: idle, actively scoring, and dizzy/locked.
const drinking=playing&&lock===0&&pressed&&flowHits(l);
const face=lock>0?faceImages.stoppp:(drinking?faceImages.drinking:faceImages.idle);
if(face.complete&&face.naturalWidth){
  const size=340*s;
  // Match the mouth drawn in the supplied skeleton artwork to the collision target.
  ctx.drawImage(face,m.x-size*.59,m.y-size*.59,size,size);
}
// Flow particles behind jar
for(const q of particles){ctx.save();ctx.globalAlpha=clamp(q.life,0,.8);ctx.fillStyle='#ffd359';ctx.shadowBlur=7*s;ctx.shadowColor='#f6c552';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();ctx.restore()}
// Jar (drawn horizontally, opening at left, rotation about central pivot)
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-angle*Math.PI/180);ctx.scale(s,s);ctx.shadowColor='#0d0808';ctx.shadowBlur=18;ctx.shadowOffsetY=7;ctx.fillStyle='#c9a17a';ctx.strokeStyle='#65452e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-123,-33);ctx.lineTo(-100,-48);ctx.bezierCurveTo(-80,-80,80,-76,105,-40);ctx.bezierCurveTo(128,-12,124,34,92,54);ctx.bezierCurveTo(38,76,-74,70,-102,43);ctx.lineTo(-123,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#8b5b3a';ctx.fillRect(-160,-29,38,52);ctx.strokeRect(-160,-29,38,52);ctx.fillStyle='#dfc49a';ctx.fillRect(-165,-35,11,64);ctx.fillStyle='#8b5c3d';ctx.beginPath();ctx.ellipse(30,-6,48,43,0,0,7);ctx.fill();ctx.strokeStyle='#e8c893';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#f6dba7';ctx.font='bold 32px serif';ctx.textAlign='center';ctx.fillText('酒',30,5);ctx.restore();
// Direction target guides
if(playing){ctx.save();ctx.globalAlpha=.5;ctx.strokeStyle='#f1d89b';ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(m.x,m.y-60*s);ctx.lineTo(m.x,m.y-130*s);ctx.stroke();ctx.restore()}}
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function stop(){pressed=false;holdTime=0;pourBtn.classList.remove('pressed')}pourBtn.addEventListener('pointerdown',e=>{if(!playing||lock>0)return;e.preventDefault();pressed=true;pourBtn.classList.add('pressed');try{pourBtn.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>pourBtn.addEventListener(ev,stop));window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});document.querySelector('#startBtn').addEventListener('click',reset);document.querySelector('#restart').addEventListener('click',reset);

})();
</script></body></html>
